name: card_organizer_app
description: "Card Organizer App (SQLite + Images)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # SQLite + local file paths
  sqflite: ^2.0.3
  path: ^1.8.0
  path_provider: ^2.0.11

  # Optional: only needed if you use network images (URLs)
  http: ^0.13.0

  # Optional (bonus): only needed if you allow picking images from gallery
  # image_picker: ^0.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Recommended: put all card images in assets/cards/
  assets:
    - assets/cards/

    # If you still want to keep these exact files too, you can leave them.
    # They are unnecessary if they already live inside assets/cards/.
    # - assets/ace_hearts.jpg
    # - assets/king_spades.jpg
    # - assets/queen_diamonds.jpg
    # - assets/jack_clubs.jpg